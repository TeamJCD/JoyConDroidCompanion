name: CI

on:
  pull_request:
    paths-ignore:
      - 'scripts/**'
      - '.gitignore'
      - 'README.md'
      - 'update.json'
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
      - '.gitignore'
      - 'README.md'
      - 'update.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Build
        run: make zip
