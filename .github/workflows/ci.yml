name: CI

on:
  pull_request:
    paths-ignore:
      - 'scripts/**'
      - '.gitignore'
      - 'README.md'
      - 'update.json'
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
      - '.gitignore'
      - 'README.md'
      - 'update.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Build
        run: make zip
