name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup

      - name: Set version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          sed -i "s/^version=.*/version=$VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/JoyConDroidCompanion-${VERSION}.zip"
          jq --arg v "$VERSION" --argjson c "$VERSION_CODE" --arg u "$ZIP_URL" \
            '.version = $v | .versionCode = $c | .zipUrl = $u' \
            update.json > update.json.tmp && mv update.json.tmp update.json

      - name: Build
        run: make zip
        env:
          RRO_KEYSTORE_B64: ${{ secrets.RRO_KEYSTORE_B64 }}
          RRO_STOREPASS: ${{ secrets.RRO_STOREPASS }}
          RRO_KEYPASS: ${{ secrets.RRO_KEYPASS }}
          RRO_ALIAS: ${{ secrets.RRO_ALIAS }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          cp build/JoyConDroidCompanion.zip "JoyConDroidCompanion-${VERSION}.zip"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "JoyConDroidCompanion-${VERSION}.zip"

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json
          git commit -m "chore: update module.prop and update.json for ${{ github.ref_name }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
